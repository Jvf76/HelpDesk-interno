services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: uai
      POSTGRES_USER: ${POSTGRES_USER:-uai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Preencha POSTGRES_PASSWORD no .env}
    volumes:
      - postgres:/var/lib/postgresql/data
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d uai"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    environment:
      BIND_ADDRESS: 0.0.0.0
      DATABASE_URL: jdbc:postgresql://db:5432/uai
      POSTGRES_USER: ${POSTGRES_USER:-uai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Preencha POSTGRES_PASSWORD}
      BOOTSTRAP_LOGIN: ${BOOTSTRAP_LOGIN:?Preencha BOOTSTRAP_LOGIN}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:?Preencha BOOTSTRAP_PASSWORD}
      SECURE_COOKIE: "true"
      MESH_ENABLED: ${MESH_ENABLED:-false}
      MESH_URL: ${MESH_URL:-https://mesh.internal:4433}
      MESH_USER: ${MESH_USER:-}
      MESH_PASSWORD: ${MESH_PASSWORD:-}
    volumes:
      - ./infra/mesh/data:/mesh-ca:ro
    depends_on:
      db: {condition: service_healthy}
  web:
    build: ./frontend
    environment:
      SITE_HOST: ${SITE_HOST:-localhost}
    ports:
      - "${BIND_IP:-127.0.0.1}:443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [backend]
  mesh:
    profiles: [remote-poc]
    build: ./infra/mesh
    ports:
      - "${BIND_IP:-127.0.0.1}:4433:4433"
    volumes:
      - ./infra/mesh/data:/opt/mesh/meshcentral-data
    networks:
      default:
        aliases: [mesh.internal]
volumes:
  postgres:
  caddy_data:
  caddy_config:
